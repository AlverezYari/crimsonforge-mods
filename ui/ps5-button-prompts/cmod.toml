# PS5 Button Prompts — Forces PlayStation button icons
# Swaps Xbox texture IDs (_XB_) to PlayStation (_PS_) in the UI CSS.
# Same-length byte patch: _XB_ and _PS_ are both 4 bytes.
#
# The game natively supports PS5 button prompts but Steam Input reports
# DualSense controllers as Xbox, forcing Xbox icons. This patches the
# CSS texture references so Xbox-mode renders PlayStation icons.

[mod]
name = "ps5-button-prompts"
version = "2.0.0"
title = "PS5 Button Prompts"
description = "Forces PlayStation 5 (DualSense) button prompt icons. Patches CSS texture references from Xbox to PlayStation."
authors = ["CrimsonForge"]
license = "MIT"

[target]
game = "crimson-desert"
game_version = "1.02.00"

# Main UI button prompts
[[patch]]
file = "ui/xml/gamemain/template/cdcommon.css"
checksum = "29e9f734b2a349315e663397dfa4c8823664aa2e97bb9d48e6b2dbce39204fc8"

