# Wide FOV — Increases base camera field of view
# Choose between 55, 70, or 90 degree FOV for each camera mode.
# All values verified against game version 1.02.00.

[mod]
name = "wide-fov"
version = "1.0.0"
title = "Wide FOV"
description = "Widens the default camera FOV from 40 degrees. Choose 55 (subtle), 70 (wide), or 90 (ultra-wide) for exploration, combat, horse, indoor, and climbing cameras."
authors = ["CrimsonForge"]
license = "MIT"

[target]
game = "crimson-desert"
game_version = "1.02.00"

[[patch]]
file = "actionchart/playercamerapreset.xml"
checksum = "f3d2c1de2d1b4e1d4c61261a7c3d17c54e013c7e5bd7e5da23ae9f491ab3d81f"

