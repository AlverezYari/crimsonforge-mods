# No Camera Shake — Removes all camera shake effects
# Zeros out every _shakeRadius value in the camera effect presets.
# Great for players who find camera shake distracting or nauseating.

[mod]
name = "no-camera-shake"
version = "1.0.0"
title = "No Camera Shake"
description = "Removes all camera shake effects by zeroing shake radius values. Affects combat hits, environmental effects, and ability impacts."
authors = ["CrimsonForge"]
license = "MIT"

[target]
game = "crimson-desert"
game_version = "1.02.00"

